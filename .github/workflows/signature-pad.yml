name: Signature Pad

# Builds only when this control (or this workflow) changes
on:
  push:
    branches: [main]
    paths:
      - "SignaturePad/**"
      - ".github/workflows/signature-pad.yml"
  pull_request:
    branches: [main]
    paths:
      - "SignaturePad/**"
      - ".github/workflows/signature-pad.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SignaturePad
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SignaturePad/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (production)
        run: npm run build -- --buildMode production

      - name: Upload control bundle
        uses: actions/upload-artifact@v7
        with:
          name: SignaturePad
          path: SignaturePad/out/controls/SignaturePad/
